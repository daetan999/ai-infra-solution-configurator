<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Solution Configurator workspace</title>
  <desc id="desc">A dark discovery workspace connecting customer requirements through deterministic rules to an explainable architecture hypothesis.</desc>
  <defs>
