    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#4fe1c1"/><stop offset="1" stop-color="#6ca8ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#1f2a36" stroke-width="1"/></pattern>
