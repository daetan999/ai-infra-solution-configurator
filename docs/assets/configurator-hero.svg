      [fill="#0f171f"] { fill: #193248 !important; }
      [fill="#16322e"], [fill="#10251f"] { fill: #314438 !important; }
      [fill="#f5f7fb"] { fill: #f2eadb !important; }
      [fill="#c8d0dc"], [fill="#aeb9c7"], [fill="#9cadbe"], [fill="#92a1b3"], [fill="#8fa0b2"], [fill="#76879a"], [fill="#6e8195"] { fill: #aebccc !important; }
      [fill="#4fe1c1"] { fill: #d3a33e !important; }
      [fill="#6ca8ff"] { fill: #8bb3c8 !important; }
      [fill="#9e91ff"] { fill: #c38a78 !important; }
