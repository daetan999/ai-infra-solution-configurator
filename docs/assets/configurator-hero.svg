      text { font-family: Bitter, Georgia, serif !important; }
      text[font-family="Arial, sans-serif"] { font-family: "Fira Sans", Arial, sans-serif !important; }
      text[letter-spacing] { font-family: "IBM Plex Mono", "Courier New", monospace !important; }
