<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Explainable deterministic rules engine</title>
  <desc id="desc">A customer requirement triggers a versioned rule, which selects a recommendation and exposes rationale, alternatives, risk, and required validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10283b"/><stop offset="1" stop-color="#081b29"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#d8a92e" stop-opacity=".15"/><stop offset=".5" stop-color="#d8a92e"/><stop offset="1" stop-color="#8bb3c8" stop-opacity=".15"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#d8a92e"/></marker>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <text x="80" y="84" fill="#d8a92e" font-family="Fira Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2.6">DETERMINISTIC RECOMMENDATION TRACE</text>
  <text x="80" y="132" fill="#f2eadb" font-family="Fira Sans, sans-serif" font-size="34" font-weight="700">No silent architecture decisions</text>
  <text x="80" y="166" fill="#b7cbd6" font-family="Fira Sans, sans-serif" font-size="15">The engine selects controlled patterns from explicit evidence and publishes the whole reasoning path.</text>
  <g transform="translate(80 218)" font-family="Fira Sans, sans-serif">
    <rect width="390" height="214" rx="16" fill="#17384f" stroke="#355059" stroke-width="2"/>
    <text x="28" y="38" fill="#8bb3c8" font-size="10" font-weight="700" letter-spacing="2">CUSTOMER REQUIREMENT</text>
    <text x="28" y="79" fill="#f2eadb" font-size="20" font-weight="700">Sensitive data must remain</text><text x="28" y="106" fill="#f2eadb" font-size="20" font-weight="700">within the selected country.</text>
    <path d="M28 134h334" stroke="#2c3946"/>
    <text x="28" y="161" fill="#b7cbd6" font-size="11">DATA SENSITIVITY</text><text x="232" y="161" fill="#f2eadb" font-size="12" font-weight="700">RESTRICTED</text>
    <text x="28" y="188" fill="#b7cbd6" font-size="11">SOVEREIGNTY</text><text x="232" y="188" fill="#f2eadb" font-size="12" font-weight="700">IN COUNTRY</text>
    <path d="M390 107h92" stroke="#d8a92e" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(562 202)" font-family="Fira Sans, sans-serif">
    <rect width="450" height="246" rx="18" fill="#183b45" stroke="#6e8fa1" stroke-width="2"/>
    <circle cx="50" cy="51" r="21" fill="#d8a92e"/><path d="M40 51l8 8 14-17" fill="none" stroke="#07110f" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="84" y="45" fill="#d8a92e" font-size="10" font-weight="700" letter-spacing="2">RULE TRIGGERED</text><text x="84" y="68" fill="#f2eadb" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">SECURITY-RESTRICTED</text>
    <rect x="28" y="94" width="394" height="58" rx="9" fill="#0a1412" stroke="#55798d"/>
    <text x="46" y="118" fill="#90a89f" font-size="10">WHEN</text><text x="46" y="138" fill="#f2eadb" font-family="IBM Plex Mono, monospace" font-size="11">sensitivity = restricted OR sovereignty ≠ none</text>
    <text x="28" y="183" fill="#b7cbd6" font-size="10">PRIORITY</text><text x="103" y="183" fill="#f2eadb" font-size="12" font-weight="700">95</text>
    <text x="171" y="183" fill="#b7cbd6" font-size="10">RULESET</text><text x="245" y="183" fill="#f2eadb" font-family="IBM Plex Mono, monospace" font-size="11">sha256:e81…</text>
    <text x="28" y="220" fill="#d8a92e" font-size="11">Higher-priority specialized rule supersedes baseline.</text>
    <path d="M450 123h92" stroke="#d8a92e" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(1104 218)" font-family="Fira Sans, sans-serif">
    <rect width="416" height="214" rx="16" fill="#17384f" stroke="#8bb3c8" stroke-width="2"/>
    <text x="28" y="38" fill="#e8d7b5" font-size="10" font-weight="700" letter-spacing="2">RECOMMENDED PATTERN</text>
    <text x="28" y="78" fill="#f2eadb" font-size="19" font-weight="700">Zero-trust security boundary</text>
    <text x="28" y="108" fill="#d7e3e8" font-size="13">Private network paths, workload identity,</text><text x="28" y="129" fill="#d7e3e8" font-size="13">customer-managed keys, and audit evidence.</text>
    <path d="M28 153h360" stroke="#2c3946"/>
    <text x="28" y="181" fill="#b7cbd6" font-size="10">LAYER</text><text x="98" y="181" fill="#f2eadb" font-size="12" font-weight="700">SECURITY</text>
  </g>
  <path d="M786 448v58" stroke="#d8a92e" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(80 520)" font-family="Fira Sans, sans-serif">
    <rect width="1440" height="220" rx="16" fill="#10283b" stroke="#2b3542"/>
    <text x="28" y="40" fill="#d8a92e" font-size="10" font-weight="700" letter-spacing="2">PUBLISHED DECISION EVIDENCE</text>
    <path d="M288 64v128M576 64v128M864 64v128M1152 64v128" stroke="#27323f"/>
    <g transform="translate(28 76)"><text fill="#b7cbd6" font-size="10">REASON</text><text y="30" fill="#f2eadb" font-size="13" font-weight="700">Constrain every trust path</text><text y="54" fill="#d7e3e8" font-size="11">to the declared data boundary.</text></g>
    <g transform="translate(316 76)"><text fill="#b7cbd6" font-size="10">ALTERNATIVE</text><text y="30" fill="#f2eadb" font-size="13" font-weight="700">Sovereign managed runtime</text><text y="54" fill="#d7e3e8" font-size="11">with verified control coverage.</text></g>
    <g transform="translate(604 76)"><text fill="#b7cbd6" font-size="10">RISK</text><text y="30" fill="#f2eadb" font-size="13" font-weight="700">Control gaps across domains</text><text y="54" fill="#d7e3e8" font-size="11">could expose restricted data.</text></g>
    <g transform="translate(892 76)"><text fill="#b7cbd6" font-size="10">REQUIRED VALIDATION</text><text y="30" fill="#f2eadb" font-size="13" font-weight="700">Threat model + data-flow review</text><text y="54" fill="#d7e3e8" font-size="11">with security and platform owners.</text></g>
    <g transform="translate(1180 76)"><text fill="#b7cbd6" font-size="10">CONFIDENCE</text><text y="34" fill="#d8a92e" font-size="24" font-weight="700">82%</text><rect y="52" width="210" height="5" rx="3" fill="#27323f"/><rect y="52" width="172" height="5" rx="3" fill="url(#beam)"/></g>
    <rect x="28" y="169" width="1384" height="26" rx="6" fill="#17384f"/><text x="720" y="187" fill="#b7cbd6" font-size="10" text-anchor="middle">INITIAL SOLUTION HYPOTHESIS · REQUIRES TECHNICAL VALIDATION</text>
  </g>
</svg>
