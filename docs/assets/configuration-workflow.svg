<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="Discovery to validation: five requirement stages feed deterministic rule synthesis, producing a solution hypothesis, a validation move, and a formal engagement path">
  <title>Discovery to validation: five requirement stages feed deterministic rule synthesis, producing a solution hypothesis, a validation move, and a formal engagement path</title>
  <desc>Five structured discovery stages feed a deterministic rules engine, which produces a solution hypothesis, validation plan, and review handoff.</desc>
  <style>
  text { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; }
  .node   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .accent { fill: #f2f2f3; stroke: #16181d; stroke-width: 1.25; }
  .store  { fill: none; stroke: #16181d; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .title  { font-size: 15px; font-weight: 600; fill: #16181d; }
  .sub    { font-size: 12px; fill: #5b6270; }
  .kick   { font-size: 10px; font-weight: 600; letter-spacing: .14em; fill: #5b6270; }
  .note   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 11px; fill: #5b6270; }
  .edge   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .edge-o { fill: none; stroke: #5b6270; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .rule   { stroke: #16181d; stroke-width: 1; opacity: .18; }
  .head   { fill: #16181d; }
  .head-o { fill: #5b6270; }
  @media (prefers-color-scheme: dark) {
    .node, .store { stroke: #e6e8eb; }
    .accent { fill: #1b2027; stroke: #e6e8eb; }
    .title { fill: #e6e8eb; }
    .sub, .kick, .note { fill: #a3abb6; }
    .edge { stroke: #e6e8eb; }
    .edge-o { stroke: #a3abb6; }
    .rule { stroke: #e6e8eb; }
    .head { fill: #e6e8eb; }
    .head-o { fill: #a3abb6; }
  }
</style>
  <text class="kick" x="40" y="38">DISCOVERY TO VALIDATION</text>
  <text class="title" x="40" y="62">A governed path from customer context to a testable hypothesis</text>
  <line class="rule" x1="40" y1="82" x2="1200" y2="82"/>
  <rect class="node" x="40" y="110" width="212" height="130" rx="2"/>
  <text class="note" x="56" y="138" letter-spacing="1.5">01</text>
  <text class="title" x="56" y="166">Intent</text>
  <text class="sub" x="56" y="191">Workload</text>
  <text class="sub" x="56" y="208">Lifecycle · scale</text>
  <rect class="node" x="277" y="110" width="212" height="130" rx="2"/>
  <text class="note" x="293" y="138" letter-spacing="1.5">02</text>
  <text class="title" x="293" y="166">Targets</text>
  <text class="sub" x="293" y="191">Latency · load</text>
  <text class="sub" x="293" y="208">Resilience · growth</text>
  <polygon class="head" points="256,170.0 265,175.0 256,180.0"/>
  <rect class="node" x="514" y="110" width="212" height="130" rx="2"/>
  <text class="note" x="530" y="138" letter-spacing="1.5">03</text>
  <text class="title" x="530" y="166">Placement</text>
  <text class="sub" x="530" y="191">Data boundaries</text>
  <text class="sub" x="530" y="208">Platform inheritance</text>
  <polygon class="head" points="493,170.0 502,175.0 493,180.0"/>
  <rect class="node" x="751" y="110" width="212" height="130" rx="2"/>
  <text class="note" x="767" y="138" letter-spacing="1.5">04</text>
  <text class="title" x="767" y="166">Operations</text>
  <text class="sub" x="767" y="191">Security · SLOs</text>
  <text class="sub" x="767" y="208">Team ownership</text>
  <polygon class="head" points="730,170.0 739,175.0 730,180.0"/>
  <rect class="node" x="988" y="110" width="212" height="130" rx="2"/>
  <text class="note" x="1004" y="138" letter-spacing="1.5">05</text>
  <text class="title" x="1004" y="166">Constraints</text>
  <text class="sub" x="1004" y="191">Budget</text>
  <text class="sub" x="1004" y="208">Timeline</text>
  <polygon class="head" points="967,170.0 976,175.0 967,180.0"/>
  <rect class="accent" x="490" y="280" width="260" height="62" rx="2"/>
  <text class="title" x="506" y="308.5">Synthesize</text>
  <text class="sub" x="506" y="327.5">Deterministic rules</text>
  <line class="edge" x1="620" y1="240" x2="620" y2="271"/>
  <polygon class="head" points="615,271 620,280 625,271"/>
  <rect class="node" x="40" y="400" width="360" height="112" rx="2"/>
  <text class="note" x="56" y="428" letter-spacing="1.5"></text>
  <text class="title" x="56" y="456">Architecture + rationale</text>
  <text class="sub" x="56" y="481">Components, alternatives, risks,</text>
  <text class="sub" x="56" y="498">confidence, and open questions.</text>
  <text class="kick" x="56" y="426">SOLUTION HYPOTHESIS</text>
  <rect class="node" x="430" y="400" width="360" height="112" rx="2"/>
  <text class="note" x="446" y="428" letter-spacing="1.5"></text>
  <text class="title" x="446" y="456">PoC + workshop</text>
  <text class="sub" x="446" y="481">Success measures, evidence owners,</text>
  <text class="sub" x="446" y="498">and decisions to resolve next.</text>
  <text class="kick" x="446" y="426">VALIDATION MOVE</text>
  <polygon class="head" points="404,451 413,456 404,461"/>
  <rect class="node" x="820" y="400" width="360" height="112" rx="2"/>
  <text class="note" x="836" y="428" letter-spacing="1.5"></text>
  <text class="title" x="836" y="456">Validate and refine</text>
  <text class="sub" x="836" y="481">Benchmark, threat-model, size,</text>
  <text class="sub" x="836" y="498">and approve the production design.</text>
  <text class="kick" x="836" y="426">FORMAL ENGAGEMENT</text>
  <polygon class="head" points="794,451 803,456 794,461"/>
  <line class="edge" x1="620" y1="342" x2="620" y2="391"/>
  <polygon class="head" points="615,391 620,400 625,391"/>
  <text class="note" x="40" y="560" text-anchor="start">Rules are versioned and resolved in stable priority order; every run is stored immutably.</text>
</svg>
