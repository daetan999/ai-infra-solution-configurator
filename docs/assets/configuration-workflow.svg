<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Solution configuration workflow</title>
  <desc id="desc">Five discovery stages feed a deterministic synthesis, an architecture hypothesis, and workshop validation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0e141d"/><stop offset="1" stop-color="#070a0f"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#4fe1c1"/><stop offset=".55" stop-color="#6ca8ff"/><stop offset="1" stop-color="#9e91ff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4fe1c1"/></marker>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#background)"/>
  <text x="90" y="90" fill="#4fe1c1" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">DISCOVERY TO VALIDATION</text>
  <text x="90" y="140" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">A governed path from customer context to a testable hypothesis</text>
  <text x="90" y="174" fill="#90a0b3" font-family="Arial, sans-serif" font-size="15">Every stage adds explicit evidence. Rules remain inspectable. Validation stays with the delivery team.</text>
  <path d="M162 296H1395" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(90 236)"><circle cx="72" cy="60" r="58" fill="#122a27" stroke="#4fe1c1" stroke-width="2"/><text x="72" y="51" fill="#4fe1c1" font-size="12" text-anchor="middle">01</text><text x="72" y="76" fill="#f5f7fb" font-size="14" font-weight="700" text-anchor="middle">Intent</text><text x="72" y="150" fill="#aeb9c7" font-size="12" text-anchor="middle">Workload</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Lifecycle · scale</text></g>
    <g transform="translate(337 236)"><circle cx="72" cy="60" r="58" fill="#101d25" stroke="#5288a2" stroke-width="2"/><text x="72" y="51" fill="#6ca8ff" font-size="12" text-anchor="middle">02</text><text x="72" y="76" fill="#f5f7fb" font-size="14" font-weight="700" text-anchor="middle">Targets</text><text x="72" y="150" fill="#aeb9c7" font-size="12" text-anchor="middle">Latency · load</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Resilience · growth</text></g>
    <g transform="translate(584 236)"><circle cx="72" cy="60" r="58" fill="#141b27" stroke="#776dcc" stroke-width="2"/><text x="72" y="51" fill="#9e91ff" font-size="12" text-anchor="middle">03</text><text x="72" y="76" fill="#f5f7fb" font-size="14" font-weight="700" text-anchor="middle">Placement</text><text x="72" y="150" fill="#aeb9c7" font-size="12" text-anchor="middle">Data boundaries</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Platform inheritance</text></g>
    <g transform="translate(831 236)"><circle cx="72" cy="60" r="58" fill="#171b25" stroke="#9b7f55" stroke-width="2"/><text x="72" y="51" fill="#f5b85c" font-size="12" text-anchor="middle">04</text><text x="72" y="76" fill="#f5f7fb" font-size="14" font-weight="700" text-anchor="middle">Operations</text><text x="72" y="150" fill="#aeb9c7" font-size="12" text-anchor="middle">Security · SLOs</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Team ownership</text></g>
    <g transform="translate(1078 236)"><circle cx="72" cy="60" r="58" fill="#1b1921" stroke="#a76370" stroke-width="2"/><text x="72" y="51" fill="#ff7a86" font-size="12" text-anchor="middle">05</text><text x="72" y="76" fill="#f5f7fb" font-size="14" font-weight="700" text-anchor="middle">Constraints</text><text x="72" y="150" fill="#aeb9c7" font-size="12" text-anchor="middle">Budget</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Timeline</text></g>
    <g transform="translate(1325 236)"><circle cx="72" cy="60" r="58" fill="#152925" stroke="#4fe1c1" stroke-width="3"/><path d="M45 60l17 17 35-38" fill="none" stroke="#4fe1c1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/><text x="72" y="150" fill="#f5f7fb" font-size="12" font-weight="700" text-anchor="middle">Synthesize</text><text x="72" y="168" fill="#718195" font-size="11" text-anchor="middle">Deterministic rules</text></g>
  </g>
  <path d="M1397 420v54H800v46" fill="none" stroke="#4fe1c1" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(180 520)" font-family="Arial, sans-serif">
    <rect width="360" height="144" rx="14" fill="#0b1118" stroke="#2e3a48"/><text x="26" y="34" fill="#6ca8ff" font-size="10" font-weight="700" letter-spacing="1.8">SOLUTION HYPOTHESIS</text><text x="26" y="66" fill="#f5f7fb" font-size="16" font-weight="700">Architecture + rationale</text><text x="26" y="93" fill="#8fa0b3" font-size="12">Components, alternatives, risks,</text><text x="26" y="113" fill="#8fa0b3" font-size="12">confidence, and open questions.</text>
    <rect x="440" width="360" height="144" rx="14" fill="#0b1118" stroke="#31554e"/><text x="466" y="34" fill="#4fe1c1" font-size="10" font-weight="700" letter-spacing="1.8">VALIDATION MOVE</text><text x="466" y="66" fill="#f5f7fb" font-size="16" font-weight="700">PoC + workshop</text><text x="466" y="93" fill="#8fa0b3" font-size="12">Success measures, evidence owners,</text><text x="466" y="113" fill="#8fa0b3" font-size="12">and decisions to resolve next.</text>
    <rect x="880" width="360" height="144" rx="14" fill="#0b1118" stroke="#554b7d"/><text x="906" y="34" fill="#9e91ff" font-size="10" font-weight="700" letter-spacing="1.8">FORMAL ENGAGEMENT</text><text x="906" y="66" fill="#f5f7fb" font-size="16" font-weight="700">Validate and refine</text><text x="906" y="93" fill="#8fa0b3" font-size="12">Benchmark, threat-model, size,</text><text x="906" y="113" fill="#8fa0b3" font-size="12">and approve the production design.</text>
    <path d="M360 72h67M800 72h67" stroke="#4fe1c1" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
